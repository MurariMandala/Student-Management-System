server:
  port: 8081
spring:
  application:
    name: student-service

  # H2 Database Configuration
  datasource:
    url: jdbc:h2:mem:student_db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

  # Enable H2 Console
  h2:
    console:
      enabled: true
      path: /h2-console